<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>T1A06-proper-and-variables-Philipp.html</title>
        <style>
            b {color:blue; }
        </style>
        <script>
            function sayHello() {
                myNum = 3;
                myString = ' Hello ';
                myFloat = 17.5;
                myBool = true;
                myOut = document.getElementById('myDiv01')
                myOut.innerHTML = myNum + myString + myFloat + ',' + myBool;
                if(myBool) {myOut.innerHTML += ', WOW';}
            }
        </script>
    </head>
    <body>
        <p>This is <b>Bold</b></p> text.</p>
        <button onclick="sayHello()">Click Me</button>
        <div id="myDiv01">...</div>
    </body>
</html>
