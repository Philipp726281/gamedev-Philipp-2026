<script>
function myExampleFunction(){
    let myIn01 = parseInt(document.getElementById('myText01').value);
    let mySum = myIn01 + myIn01;
    let myReply = myIn01 + ' + ' + myIn01 + ' = ' + mySum;
    return myReply;
}
</script>

<h2 align="center">T1A09-Functions-by-Philipp</h2>

<a href="https://www.w3schools.com/js/js_functions.asp">
    Good reference to Javascript functions
</a><br>

<p>
Functions are used to sensibly organize code. Then they are "called" elsewhere.
Information can also be passed to functions.
</p>

<h4>Example of working code</h4>

<input type="text" id="myText01" value="3"><br>

<input type="button" value="Function Example"
    onclick="document.getElementById('MyDiv01').innerHTML = myExampleFunction()">

<div id="MyDiv01">...</div>
