<h1 align="center">T2A20-sort-Philipp.html</h1>

<script>
    let myMax = 3; // 52 when working
    let myCards = new Array(myMax);

    function randomCards() {
        for (let myLoop = 0; myLoop < myMax; myLoop++) {
            myCards[myLoop] = Math.floor(Math.random() * 10);
        }
        showCards();
    }

    function showCards() {
        let myTemp = '';

        for (let myLoop = 0; myLoop < myMax; myLoop++) {
            myTemp += myLoop + ' = ' + myCards[myLoop] + '<br>';
        }

        document.getElementById('myDiv01').innerHTML = myTemp;
    }

    function sortCards() {
        // Bubble Sort
        for (let i = 0; i < myMax - 1; i++) {
            for (let j = 0; j < myMax - 1 - i; j++) {

                if (myCards[j] > myCards[j + 1]) {
                    let myTemp = myCards[j];
                    myCards[j] = myCards[j + 1];
                    myCards[j + 1] = myTemp;
                }

            }
        }

        showCards();
    }
</script>

<input type="button" value="Set Random" onclick="randomCards()">

<input type="button" value="Show" onclick="showCards()">

<input type="button" value="Sort" onclick="sortCards()">

<div id="myDiv01"></div>
