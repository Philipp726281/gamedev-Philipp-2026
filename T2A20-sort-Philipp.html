
<!DOCTYPE html>
<html>
<head>
<title>t2a20 Sort</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #263445;
    text-align: center;
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 { color: #2563eb; }

p { color: #64748b; }

input[type=button] {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    margin: 6px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

input[type=button]:hover {
    filter: brightness(0.85);
    transform: translateY(-2px);
}

.green { background: #16a34a !important; }
.orange { background: #ea580c !important; }
.purple { background: #7c3aed !important; }
.red { background: #dc2626 !important; }

.number-container {
    display: flex;
    justify-content: center;
    align-items: end;
    gap: 5px;
    min-height: 200px;
    margin-top: 25px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 12px;
    flex-wrap: wrap;
}

.number {
    background: #3b82f6;
    color: white;
    min-width: 35px;
    padding: 10px 5px;
    border-radius: 6px;
    font-weight: bold;
}

#myDiv01 {
    margin-top: 20px;
    padding: 15px;
    background: #f1f5f9;
    border-radius: 10px;
    text-align: left;
    line-height: 1.8;
}

input[type=number] {
    padding: 9px;
    width: 65px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}
</style>
</head>

<body>

<div class="container">

<h1>t2a20 Sort</h1>
<p>Generate, display and sort random numbers.</p>

<p>
Number of values:
<input type="number" id="myAmount" value="10" min="2" max="100">
</p>

<input type="button" value="Set Random" onclick="{
    myMax = Math.max(2, Math.min(100, Number(document.getElementById('myAmount').value)));
    myCards = [];
    for (let i = 0; i < myMax; i++) {
        myCards[i] = Math.floor(Math.random() * 100);
    }
    showNumbers();
}">

<input type="button" value="Show" onclick="showNumbers()">

<br>

<input type="button" class="green" value="Bubble Sort" onclick="bubbleSort()">

<input type="button" class="orange" value="Selection Sort" onclick="selectionSort()">

<input type="button" class="purple" value="Insertion Sort" onclick="insertionSort()">

<br>

<input type="button" value="Reverse" onclick="{
    myCards.reverse();
    showNumbers();
}">

<input type="button" class="red" value="Reset" onclick="{
    myCards = [];
    showNumbers();
}">

<div id="myDiv01">Click Set Random to start!</div>

<div class="number-container" id="myGraph"></div>

</div>

<script>
let myMax = 10;
let myCards = [];

function showNumbers() {
    let output = '';

    for (let i = 0; i < myCards.length; i++) {
        output += '<b>' + i + ':</b> ' + myCards[i] + '<br>';
    }

    document.getElementById('myDiv01').innerHTML = output || 'No numbers available.';

    let graph = '';

    for (let i = 0; i < myCards.length; i++) {
        let height = myCards[i] * 1.5 + 10;

        graph += '<div class="number" style="height:' + height + 'px">' 
              + myCards[i] + '</div>';
    }

    document.getElementById('myGraph').innerHTML = graph;
}


// BUBBLE SORT
function bubbleSort() {
    for (let i = 0; i < myCards.length; i++) {
        for (let j = 0; j < myCards.length - i - 1; j++) {
            if (myCards[j] > myCards[j+1]) {
                let temp = myCards[j];
                myCards[j] = myCards[j+1];
                myCards[j+1] = temp;
            }
        }
    }
    showNumbers();
}


// SELECTION SORT
function selectionSort() {
    for (let i = 0; i < myCards.length; i++) {
        let minIndex = i;

        for (let j = i + 1; j < myCards.length; j++) {
            if (myCards[j] < myCards[minIndex]) {
                minIndex = j;
            }
        }

        let temp = myCards[i];
        myCards[i] = myCards[minIndex];
        myCards[minIndex] = temp;
    }

    showNumbers();
}


// INSERTION SORT
function insertionSort() {
    for (let i = 1; i < myCards.length; i++) {
        let current = myCards[i];
        let j = i - 1;

        while (j >= 0 && myCards[j] > current) {
            myCards[j + 1] = myCards[j];
            j--;
        }

        myCards[j + 1] = current;
    }

    showNumbers();
}
</script>

</body>
</html>
