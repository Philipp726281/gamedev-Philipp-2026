
<html>
<body>

<h1 align="center">T2A20-sort-Philipp.html</h1>

<script>
    let myMax = 3; // 52 when working
    let myCards = new Array(myMax);
</script>

<input type="button" value="Set Random" onclick="
    for (let myLoop = 0; myLoop < myMax; myLoop++) {
        myCards[myLoop] = Math.floor(Math.random() * 10);
    }
    document.getElementById('myDiv01').innerHTML = 'Random numbers set!';
">

<input type="button" value="Show" onclick="
    let myTemp = '';
    for (let myLoop = 0; myLoop < myMax; myLoop++) {
        myTemp += myLoop + ' = ' + myCards[myLoop] + '<br>';
    }
    document.getElementById('myDiv01').innerHTML = myTemp;
">

<input type="button" value="Sort" onclick="
    let myTemp = 0;

    for (let myLoop2 = 0; myLoop2 < myMax - 1; myLoop2++) {
        for (let myLoop = 0; myLoop < myMax - 1 - myLoop2; myLoop++) {

            if (myCards[myLoop] > myCards[myLoop + 1]) {
                myTemp = myCards[myLoop];
                myCards[myLoop] = myCards[myLoop + 1];
                myCards[myLoop + 1] = myTemp;
            }
        }
    }

    let myShow = '';
    for (let myLoop = 0; myLoop < myMax; myLoop++) {
        myShow += myLoop + ' = ' + myCards[myLoop] + '<br>';
    }

    document.getElementById('myDiv01').innerHTML = myShow;
">

<div id="myDiv01">
   Set Random Numbers
</div>

</body>
</html>

<hr style="border: 0; height: 4px; background-color: #E30000; margin: 35px 0;">

<!-- BUBBLE SORT DESIGN -->

<style>
.bubble-container {
    max-width: 850px;
    margin: 30px auto;
    padding: 25px;
    background: #fff5f5;
    border: 1px solid #ffd6d6;
    border-radius: 18px;
    box-shadow: 0 6px 20px rgba(150, 0, 0, 0.10);
    font-family: Arial, sans-serif;
}

.bubble-title {
    background: linear-gradient(135deg, #e30000, #ff5555);
    color: white;
    text-align: center;
    padding: 22px;
    border-radius: 13px;
    margin: 0 0 12px 0;
    text-shadow: 2px 2px 3px #790000;
    box-shadow: 0 4px 10px #e3000030;
}

.bubble-subtitle {
    text-align: center;
    color: #9c5555;
    margin-bottom: 25px;
}

.bubble-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
}

.bubble-buttons input {
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    color: white;
    background: #e53939;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.bubble-buttons input:hover {
    background: #b90000;
    transform: translateY(-3px);
    box-shadow: 0 5px 12px #e3000040;
}

.bubble-buttons input:active {
    transform: scale(0.96);
}

.bubble-output {
    background: white;
    border: 1px solid #ffdada;
    border-radius: 12px;
    padding: 20px;
    min-height: 75px;
    color: #783333;
    line-height: 2;
}

.bubble-output strong {
    color: #d00000;
}

.bubble-number {
    display: inline-block;
    background: #ffe1e1;
    color: #bd1717;
    font-size: 17px;
    font-weight: bold;
    padding: 10px 15px;
    margin: 5px;
    border-radius: 8px;
    border: 1px solid #ffc2c2;
}

.bubble-info {
    text-align: center;
    color: #a36b6b;
    font-size: 12px;
    margin-top: 18px;
}
</style>

<div class="bubble-container">

    <h1 class="bubble-title">
        Bubble Sort
    </h1>

    <p class="bubble-subtitle">
        Random Numbers · Sorting Algorithm
    </p>

    <script>
        let bubbleMax = 10;
        let bubbleCards = new Array(bubbleMax);
    </script>

    <div class="bubble-buttons">

        <input type="button" value="Generate Numbers" onclick="{
            for (let i = 0; i < bubbleMax; i++) {
                bubbleCards[i] = Math.floor(Math.random() * 100);
            }

            document.getElementById('bubbleDiv').innerHTML =
                '10 random numbers created! Click Show Numbers.';
        }">

        <input type="button" value="Show Numbers" onclick="{
            let output = '<strong>Original Numbers:</strong><br>';

            for (let i = 0; i < bubbleMax; i++) {
                output += '<span class=bubble-number>' + bubbleCards[i] + '</span>';
            }

            document.getElementById('bubbleDiv').innerHTML = output;
        }">

        <input type="button" value="Bubble Sort" onclick="{
            for (let i = 0; i < bubbleMax; i++) {
                for (let j = 0; j < bubbleMax - 1 - i; j++) {

                    if (bubbleCards[j] > bubbleCards[j+1]) {
                        let temp = bubbleCards[j];
                        bubbleCards[j] = bubbleCards[j+1];
                        bubbleCards[j+1] = temp;
                    }
                }
            }

            let output = '<strong>Sorted Numbers:</strong><br>';

            for (let i = 0; i < bubbleMax; i++) {
                output += '<span class=bubble-number>' + bubbleCards[i] + '</span>';
            }

            document.getElementById('bubbleDiv').innerHTML = output;
        }">

    </div>

    <div class="bubble-output" id="bubbleDiv">
        Your numbers will appear here...
    </div>

    <div class="bubble-info">
        BUBBLE SORT · 10 NUMBERS · ASCENDING ORDER
    </div>

</div>

</body>
</html>
