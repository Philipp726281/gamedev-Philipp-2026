<div id="healthBar" style="background-color: #E30000; width: 200px; height: 20px;">
    <div id="health" style="background-color: #005C07; width: 100%; height: 20px;"></div>
</div>

<p id="myDiv01">Health: 100 / 100</p>

<style>
    #myDiv01 {
        background-color: #5E5E5E;
        color: #C2C2C2;
        padding: 20px;
        border-radius: 13px;
    }
</style>

<script>
    let player = {
        health: 100
    };

    function updateHealth() {

        if (player.health < 0) {
            player.health = 0;
        }

        if (player.health > 100) {
            player.health = 100;
        }

        if (player.health == 0) {
            alert('YOU ARE DEAD 💀');
        }


        document.getElementById('health').style.width =
            player.health + '%';

        document.getElementById('myDiv01').innerHTML =
            'Health: ' + player.health + ' / 100';

        if (player.health < 21) {
            document.getElementById('health').style.backgroundColor = '#FFD700';
        } else {
            document.getElementById('health').style.backgroundColor = '#005C07';
        }


    }

    updateHealth();
</script>

<input type="button" value="Damage 10" onclick="{
    player.health -= 10;
    updateHealth();
}">

<input type="button" value="Heal Potion (+10)" onclick="{
    player.health += 10;
    updateHealth();
}">
